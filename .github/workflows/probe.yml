name: probe-sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reachability of price sources from GitHub runners
        run: |
          for u in "https://www.cbi.ir/ExRates/rates_fa.aspx" "https://www.ime.co.ir/" "https://www.ime.co.ir/offer-stat.html" "https://api.gold-api.com/price/XAU" "https://query1.finance.yahoo.com/v8/finance/chart/BZ=F?range=1d&interval=5m"; do
            echo "$(curl -s -o /tmp/o -m 30 -w '%{http_code} %{time_total}s' -A 'Mozilla/5.0' "$u") $(wc -c < /tmp/o)b $u"
          done
